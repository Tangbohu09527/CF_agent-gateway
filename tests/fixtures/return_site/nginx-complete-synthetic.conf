# SYNTHETIC COMPLETE INPUT: not a copy of any deployed Nginx configuration.
worker_processes 1;
pid /tmp/cf-return-synthetic/nginx.pid;
error_log /tmp/cf-return-synthetic/error.log warn;
events { worker_connections 128; }
http {
    default_type application/octet-stream;
    access_log off;
    server {
        listen 8443 ssl default_server;
        server_name localhost;
        ssl_certificate /synthetic/server.pem;
        ssl_certificate_key /synthetic/server-key.pem;
        client_max_body_size 16k;
        resolver 127.0.0.11 valid=30s;
        set $gateway_upstream gateway:8000;
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        # Preserve this authenticated route, its variable upstream and exact URI.
        location ^~ /internal/hermes/inbound-bindings/ {
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://$gateway_upstream;
        }
        location ^~ /inbound-media/ {
            proxy_pass http://$gateway_upstream;
        }
        # Default deny and unrelated routes must remain byte-identical.
        location / { return 404; }
    }
}

name: Fixed Hermes host compatibility

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: hermes-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-windows-listener:
    name: Official Windows manager and persistent listener config (0f4a98f)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Preserve official Git blob bytes
        run: git config --global core.autocrlf false
      - name: Check out Gateway
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out immutable official Hermes
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 0f4a98f87c17007b81500239d0bd5b9574027b73
          path: .pytest_cache/hermes-listener-probe/source
          persist-credentials: false
      - name: Set up Gateway test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build isolated Gateway dependencies
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          root = Path('.pytest_cache/hermes-listener-probe/gateway-venv')
          subprocess.run([sys.executable, '-m', 'venv', str(root)], check=True)
          subprocess.run([str(root / 'Scripts/python.exe'), '-m', 'pip', 'install',
                          '-e', '.[dev]', 'psutil==7.2.2'], check=True)
      - name: Set up fixed official Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Build isolated Hermes dependencies
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          root = Path('.pytest_cache/hermes-listener-probe/hermes-venv')
          subprocess.run([sys.executable, '-m', 'venv', str(root)], check=True)
          subprocess.run([str(root / 'Scripts/python.exe'), '-m', 'pip', 'install',
                          '-r', 'tests/hermes_return_probe/requirements.txt'], check=True)
      - name: Reproduce override then verify official managed restart and readonly TLS
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          root = Path('.pytest_cache/hermes-listener-probe').resolve()
          subprocess.run([str(root / 'gateway-venv/Scripts/python.exe'),
                          'tests/hermes_listener_probe/probe.py',
                          '--hermes-source', str(root / 'source'),
                          '--hermes-python', str(root / 'hermes-venv/Scripts/python.exe'),
                          '--output', str(root / 'case')], check=True)
      - name: Preserve only sanitized result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-hermes-listener-${{ github.sha }}
          path: .pytest_cache/hermes-listener-probe/case/report.json
          if-no-files-found: warn
          retention-days: 7

  real-hermes-api:
    name: Real Hermes API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out Gateway
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out immutable official Hermes source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 4d55ca91656ac5f83e1506679b7f81e0238e5e16
          path: .pytest_cache/hermes-host-probe/source
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/hermes_host_probe/requirements.txt
      - name: Build isolated probe environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path('.pytest_cache/hermes-host-probe/venv')
          subprocess.run([sys.executable, '-m', 'venv', str(root)], check=True)
          python = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-m', 'pip', 'install', '-r',
                          'tests/hermes_host_probe/requirements.txt'], check=True)
      - name: Exercise real authenticated APIs with loopback model only
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          python = Path('.pytest_cache/hermes-host-probe/venv') / (
              'Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-I', '-B', 'tests/hermes_host_probe/probe.py',
                          '--hermes-source', '.pytest_cache/hermes-host-probe/source'], check=True)

  official-artifact-return:
    name: Official Hermes HTTPS artifact return (${{ matrix.os }}, ${{ matrix.hermes }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        hermes:
          - 0f4a98f87c17007b81500239d0bd5b9574027b73
          - 427d605d4985c2d49a795493ef6c5d66413057d1
    steps:
      - name: Preserve official Git blob bytes
        run: git config --global core.autocrlf false
      - name: Check out Gateway
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out selected immutable official Hermes source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: .pytest_cache/hermes-return-probe/source
          persist-credentials: false
      - name: Set up Gateway test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build isolated Gateway test environment
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          root = Path('.pytest_cache/hermes-return-probe/gateway-venv')
          subprocess.run([sys.executable, '-m', 'venv', str(root)], check=True)
          python = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-m', 'pip', 'install', '-e', '.[dev]'], check=True)
      - name: Set up pinned official Hermes test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: tests/hermes_return_probe/requirements.txt
      - name: Build separate official probe dependency environment
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          root = Path('.pytest_cache/hermes-return-probe/hermes-venv')
          subprocess.run([sys.executable, '-m', 'venv', str(root)], check=True)
          python = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-m', 'pip', 'install', '-r',
                          'tests/hermes_return_probe/requirements.txt'], check=True)
      - name: Exercise official HTTPS and real Agent tools for text, PDF and PNG
        shell: python
        env:
          PROBE_HERMES_COMMIT: ${{ matrix.hermes }}
        run: |
          import os, subprocess
          from pathlib import Path
          root = Path('.pytest_cache/hermes-return-probe').resolve()
          executable = 'Scripts/python.exe' if os.name == 'nt' else 'bin/python'
          packages = 'Lib/site-packages' if os.name == 'nt' else 'lib/python3.14/site-packages'
          cases = [('legacy', kind, False) for kind in ('text', 'file', 'image')]
          cases += [('v2', kind, False) for kind in ('text', 'file', 'image')]
          cases += [('v2', 'text', True)]
          for routing, kind, established in cases:
              suffix = f'{routing}-{kind}' + ('-established' if established else '')
              subprocess.run([str(root / 'gateway-venv' / executable),
                              'tests/hermes_return_probe/probe.py',
                              '--hermes-source', str(root / 'source'),
                              '--hermes-commit', os.environ['PROBE_HERMES_COMMIT'],
                              '--hermes-python', str(root / 'hermes-venv' / executable),
                              '--site-packages', str(root / 'hermes-venv' / packages),
                              '--output', str(root / f'case-{suffix}'), '--kind', kind,
                              '--routing', routing] +
                             (['--established-session'] if established else []), check=True)
      - name: Preserve only sanitized isolated summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-hermes-artifact-return-${{ matrix.os }}-${{ matrix.hermes }}-${{ github.sha }}
          path: |
            .pytest_cache/hermes-return-probe/case-*/safe-summary.json
          if-no-files-found: warn
          retention-days: 7

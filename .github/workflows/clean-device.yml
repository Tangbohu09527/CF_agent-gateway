name: Clean device installation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-device-a:
    name: A - Debian 13 isolated daemon official installation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check every repository shell file
        shell: bash
        run: |
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(git ls-files -z '*.sh')
      - name: Verify fixed WeChat PR merge evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DIR: ${{ runner.temp }}/clean-device-evidence
        run: |
          mkdir -p "$EVIDENCE_DIR"
          gh api repos/Tangbohu09527/CF_agent-wechat/pulls/7 \
            --jq '{number,merged,merge_commit_sha,head_sha:.head.sha}' \
            > "$EVIDENCE_DIR/wechat-pr-7.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['EVIDENCE_DIR']) / 'wechat-pr-7.json').read_text())
          assert data['merged'] is True, 'Final combination requires WeChat PR #7 merged'
          assert data['head_sha'] == '67cbbb04ce15703428ce165ac38effac19f4b701'
          PY
      - name: Execute official install from empty Debian and Docker stores
        env:
          GATEWAY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/clean-device-evidence
        run: bash tests/deployment/run_clean_device.sh
      - name: Upload A evidence with explicit real and synthetic boundaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-device-A-${{ github.run_id }}
          path: ${{ runner.temp }}/clean-device-evidence
          retention-days: 14

name: Isolated native Hermes MCP boundary

on:
  push:
    branches: [codex/feat-native-hermes-remote-tools]
    paths: [tests/native_mcp_probe.py, tests/native_mcp_file_service.py, tests/native_mcp_dependencies.py, tests/native_mcp_official_install.sh, .github/workflows/native-hermes-mcp.yml]
  pull_request:
    paths: [tests/native_mcp_probe.py, tests/native_mcp_file_service.py, tests/native_mcp_dependencies.py, tests/native_mcp_official_install.sh, .github/workflows/native-hermes-mcp.yml]

permissions:
  contents: read

concurrency:
  group: native-mcp-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 427d605d4985c2d49a795493ef6c5d66413057d1
          path: .pytest_cache/native/official-home/hermes-agent
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tangbohu09527/CF_filebrowser-enterprise
          ref: 3d556786068994826b8105ff4a1d11572b84b1b1
          path: .pytest_cache/native/filebridge
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: .pytest_cache/native/filebridge/backend/go.sum
      - name: Compile real scoped HTTP fixture
        working-directory: .pytest_cache/native/filebridge/backend
        run: go test ./http -run '^TestProductMaterialsExternalFixture$' -count=1 -timeout=5m
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Official installer dependency stage, locked full default environment
        run: bash tests/native_mcp_official_install.sh .pytest_cache/native/official-home/hermes-agent .pytest_cache/native/dependency-summary.json
      - name: Official clean API, remote content, employee export and missing task binding
        run: |
          "$NATIVE_OFFICIAL_PYTHON" -I -B tests/native_mcp_probe.py \
            --hermes-source .pytest_cache/native/official-home/hermes-agent \
            --hermes-python "$NATIVE_OFFICIAL_PYTHON" \
            --dependency-summary .pytest_cache/native/dependency-summary.json \
            --filebridge-source .pytest_cache/native/filebridge \
            --output .pytest_cache/native/evidence --api
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mcp-boundary-${{ github.sha }}
          path: |
            .pytest_cache/native/evidence/safe-summary.json
            .pytest_cache/native/dependency-summary.json
          if-no-files-found: error
          retention-days: 14

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>CF · 微信管理工作台</title><link rel="icon" type="image/svg+xml" href="/console/assets/icon.svg"><link rel="stylesheet" href="/console/assets/style.css"><script src="/console/assets/app.js" defer></script></head>
<body><section id="login-screen" class="login-screen" aria-labelledby="login-title"><div class="login-card"><div class="brand-mark" aria-hidden="true">CF</div><p class="eyebrow">企业 AI 自动化</p><h1 id="login-title">微信管理工作台</h1><p class="login-description">查看已同步的联系人与聊天，管理员工权限及独立 AI 档案。</p><form id="login-form"><label>管理员账号<input name="username" autocomplete="username" required autofocus placeholder="请输入管理员账号"></label><label>登录密码<input name="password" type="password" autocomplete="current-password" required placeholder="请输入登录密码"></label><p id="login-error" class="field-error" role="alert" hidden></p><button class="primary wide" type="submit">登录工作台</button></form><p class="login-note">候选环境 · 管理设置仅在本候选中生效</p></div></section>
<div id="app" class="app" hidden><aside class="sidebar"><a class="brand" href="#chats" aria-label="CF 工作台首页"><span class="brand-mark">CF</span><span class="brand-copy">微信工作台<small>企业 AI 自动化</small></span></a><nav id="navigation" aria-label="主导航"><button data-page="chats" title="聊天"><span data-icon="chat"></span><span>聊天</span></button><button data-page="contacts" title="通讯录"><span data-icon="contacts"></span><span>通讯录</span></button><button data-page="rooms" title="群聊"><span data-icon="group"></span><span>群聊</span></button><div class="nav-divider"></div><button data-page="employees" title="员工与权限"><span data-icon="shield"></span><span>员工与权限</span></button><button data-page="groups" title="分组与模板"><span data-icon="layers"></span><span>分组与模板</span></button><button data-page="profiles" title="AI 节点与 Profile"><span data-icon="nodes"></span><span>AI 节点与 Profile</span></button><button data-page="system" title="系统状态"><span data-icon="activity"></span><span>系统状态</span></button></nav><div class="sidebar-bottom"><span class="candidate-pill"><i></i>候选工作区</span><button id="logout" class="logout" title="退出登录"><span data-icon="logout"></span><span>退出登录</span></button></div></aside>
<div class="workspace"><header class="topbar"><div class="breadcrumb"><span>工作台</span><span>/</span><strong id="page-title">聊天</strong></div><div class="topbar-actions"><span id="environment-label" class="environment-label">隔离测试数据</span><label class="source-control"><span class="sr-only">微信来源账号</span><select id="source-select" aria-label="微信来源账号"></select></label><button id="refresh" class="icon-button" aria-label="刷新当前页面" title="刷新"><span data-icon="refresh"></span></button><span class="admin-avatar">管</span></div></header><div class="scope-strip"><span data-icon="shield"></span><span id="scope-label">仅候选生效 · 微信源只读，不发送消息或修改微信数据</span><button id="source-sync" class="text-button" data-write>同步来源</button><span id="sync-label">尚未同步</span></div><div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button id="toast-close" aria-label="关闭提示">×</button></div><main id="main" tabindex="-1"><div class="initial-loading"><span class="spinner"></span>正在连接管理服务…</div></main></div></div>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title"><div class="drawer-header"><div><p id="drawer-eyebrow" class="eyebrow"></p><h2 id="drawer-title"></h2></div><button id="drawer-close" class="icon-button" aria-label="关闭详情"><span data-icon="close"></span></button></div><div id="drawer-body" class="drawer-body"></div></dialog></body></html>

server:
  host: "0.0.0.0"
  port: 8080

database:
  url: "sqlite:///./data/gateway.db"

logging:
  level: "INFO"

artifact:
  storage_root: "./data/artifacts"

runtime:
  polling_interval_seconds: 3
  v2_routing_enabled: false

worker:
  enabled: false
  concurrency: 4
  lease_seconds: 60
  retry_limit: 3

wechat:
  enabled: false
  base_url: "http://127.0.0.1:6174"
  bootstrap_mode: "latest"
  token_env: "CF_AGENT_WECHAT_TOKEN"

hermes:
  enabled: false
  base_url: ""
  # Store only the environment variable name here, never the API key.
  api_key_env: "HERMES_API_KEY"
  model: "hermes-agent"

server:
  host: "0.0.0.0"
  port: 8080

database:
  url: "sqlite:///./data/gateway.db"

logging:
  level: "INFO"

api:
  message_auth_enabled: true
  # Store only the environment variable name here, never the bearer token.
  bearer_token_env: "CF_AGENT_GATEWAY_API_TOKEN"

runtime:
  polling_interval_seconds: 3
  polling_retry_max_seconds: 60
  heartbeat_interval_seconds: 5
  heartbeat_stale_after_seconds: 30
  cycle_stale_after_seconds: 300

wechat:
  enabled: false
  base_url: "http://127.0.0.1:6174"
  bootstrap_mode: "latest"
  token_env: "CF_AGENT_WECHAT_TOKEN"

hermes:
  enabled: false
  base_url: ""
  # Store only the environment variable name here, never the API key.
  api_key_env: "HERMES_API_KEY"
  model: "hermes-agent"
